name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # No test suite or real linter in this app (see CLAUDE.md) - this is the closest thing
      # to a smoke check: every JS file must at least parse.
      - name: Syntax-check all JS files
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check

      - name: Build Docker image
        run: docker build -t checklist-app:ci .
