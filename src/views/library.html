<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library - Safe Catering Checklist</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="help_overlay.css">
    <style>
        #library_container {
            display: flex;
            flex-direction: column;
        }

        #search_section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #fff;
            border: 1pt solid #000;
            padding: 8pt;
            margin-bottom: 8pt;
        }

        .search_label {
            font-size: 9pt;
            font-weight: 600;
            color: #333;
        }

        #search_section input {
            width: 100%;
            padding: 8pt 10pt;
            border: 1pt solid #000;
            font-size: 10pt;
            font-family: Myriad Pro, sans-serif;
        }

        .search_buttons {
            display: flex;
            gap: 8px;
        }

        .search_buttons button {
            flex: 1;
            padding: 8pt 10pt;
            border: 1pt solid #000;
            cursor: pointer;
            font-weight: 600;
            font-size: 9pt;
            font-family: Myriad Pro, sans-serif;
        }

        #search_btn {
            background-color: #79fca4;
            color: #000;
        }

        #clear_btn {
            background-color: #fff;
            color: #000;
        }

        #records_list {
            display: flex;
            flex-direction: column;
            gap: 8pt;
            overflow-y: auto;
            padding-right: 2px;
        }

        .checklist_card_l {
            background-color: #fff;
            border: 1pt solid #000;
            padding: 8pt;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 0;
            border-bottom-right-radius: 12px;
            border-top-right-radius: 12px;
        }

        .record_info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .record_name {
            font-weight: 600;
            color: #333;
            word-break: break-word;
            font-size: 9pt;
        }

        .record_date {
            font-size: 8.5pt;
            color: #666;
        }

        .record_actions {
            display: flex;
            gap: 8px;
        }

        .record_actions button {
            flex: 1;
            min-height: 36px;
            border: 1pt solid #000;
            cursor: pointer;
            font-size: 9pt;
            font-weight: 600;
            font-family: Myriad Pro, sans-serif;
        }

        .btn_view {
            background-color: #ffffff;
            color: #000;
        }

        .btn_delete {
            background-color: #ffabab;
            color: #000;
            border-bottom-right-radius: 12px;
        }

        .no_records {
            text-align: center;
            color: #666;
            padding: 20px 12px;
            font-size: 9.5pt;
            background: #fff;
            border: 1pt solid #000;
        }

        .record_meta {
            display: inline-flex;
            align-items: center;
            align-self: flex-start;
            padding: 4px 8px;
            border: 1pt solid #000;
            background: #f7f7f7;
            font-size: 8pt;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .segment {
            flex: 1;
            padding: 6px 8px;
            border: 1pt solid #000;
            background: #fff;
            font-weight: 700;
            cursor: pointer;
            font-size: 9pt;
        }

        .segment.active {
            background-color: #79fca4;
            color: #000;
        }
    </style>
</head>

<body>

<div id="phone_body" style="padding-bottom: 0;">

    <div>
        <!-- HEADER -->
        <div id="header">
            <button id="back_button" onclick="window.location.href='/'">
                <img src="/asset1.png" alt="Back">
            </button>

            <div id="title">
                <img src="/asset2.png" alt="Title">
                <h1>Library</h1>
            </div>
        </div>

        <!-- DATE -->
        <div style="display: flex;">
            <div id="date">Date: <span id="current_date"></span></div>
            
            <button id="info" style="margin-left:8px;" data-help="library_explanation_functions" onclick="openHelp(this.dataset.help)">
                <img src="https://www.svgrepo.com/show/502710/info.svg" alt="Info">
            </button>
        </div>

        <!-- SEARCH SECTION -->
        <div id="search_section">
            <div class="search_label">Search</div>

            <div id="segment_buttons" style="display:flex; gap:6px;">
                <button class="segment active" data-target="date" id="seg_date">Date</button>
                <button class="segment" data-target="checklist" id="seg_checklist">Checklist</button>
                <button class="segment" data-target="employee" id="seg_employee">Employee</button>
            </div>

            <div id="search_inputs" style="margin-top:8px; display:flex; flex-direction:column; gap:8px;">
                <input type="date" id="search_date" placeholder="Search by date">

                <select id="search_checklist" style="display:none; padding:8pt 10pt; border:1pt solid #000; font-size:10pt;">
                    <option value="">All checklists</option>
                    <option value="SC1">SC1</option>
                    <option value="SC2">SC2</option>
                    <option value="SC3">SC3</option>
                    <option value="SC4">SC4</option>
                    <option value="SC5">SC5</option>
                    <option value="SC6">SC6</option>
                    <option value="SC7">SC7</option>
                </select>

                <input type="text" id="search_employee" placeholder="Employee name" style="display:none; padding:8pt 10pt; border:1pt solid #000; font-size:10pt;">
            </div>

            <div class="search_buttons">
                <button id="search_btn">Search</button>
                <button id="clear_btn">Clear</button>
            </div>
        </div>
    </div>

    <!-- RECORDS LIST -->
    <div id="library_container" style="flex: 1; overflow-y: auto;">
        <div id="records_list">
            <!-- Records will be inserted here -->
        </div>
    </div>


</div>

<script src="help_overlay.js"></script>

<script>
    // Initialize date
    const today = new Date().toLocaleDateString('en-GB');
    document.getElementById('current_date').textContent = today;

    // Get employee data
    let employeeData = null;

    const initializeEmployee = async () => {
        const stored = sessionStorage.getItem('employeeData');
        if (stored) {
            employeeData = JSON.parse(stored);
        } else {
            try {
                const response = await fetch('/api/employee');
                if (!response.ok) {
                    return;
                }
                const data = await response.json();
                if (data.success) {
                    employeeData = data.employee;
                    sessionStorage.setItem('employeeData', JSON.stringify(employeeData));
                }
            } catch (err) {
                // Ignore unauthenticated or unavailable employee fetches on the library page.
            }
        }
    };

    let allRecords = [];

    // Fetch all records
    const fetchRecords = async () => {
        try {
            const response = await fetch('/api/records');
            const data = await response.json();
            if (data.success) {
                allRecords = data.records || [];
                renderRecords(allRecords);
            }
        } catch (err) {
            console.error('Error fetching records:', err);
            document.getElementById('records_list').innerHTML = '<div class="no_records">Error loading records</div>';
        }
    };

    // Render records
    const renderRecords = (records) => {
        const container = document.getElementById('records_list');
        
        if (records.length === 0) {
            container.innerHTML = '<div class="no_records">No records found</div>';
            return;
        }

        container.innerHTML = '';

        records.forEach(record => {
            const div = document.createElement('div');
            div.className = 'checklist_card_l';

            // Extract date from filename (format: SC5-DD-MM-YYYY-Name-Position.pdf)
            const dateMatch = record.match(/SC\d-(\d{2})-(\d{2})-(\d{4})/);
            let dateStr = 'Unknown date';
            if (dateMatch) {
                dateStr = `${dateMatch[1]}/${dateMatch[2]}/${dateMatch[3]}`;
            }

            if(!employeeData) {
                div.innerHTML = `
                    <div class="record_info">
                        <div class="record_meta">Saved Record</div>
                        <div class="record_name">${record}</div>
                        <div class="record_date">Date: ${dateStr}</div>
                    </div>
                    <div class="record_actions">
                        <button class="btn_view" onclick="downloadRecord('${record}')">View</button>
                    </div>
                `;
                container.appendChild(div);
                return;
            }

            div.innerHTML = `
                <div class="record_info">
                    <div class="record_meta">Saved Record</div>
                    <div class="record_name">${record}</div>
                    <div class="record_date">Date: ${dateStr}</div>
                </div>
                <div class="record_actions">
                    <button class="btn_view" onclick="downloadRecord('${record}')">View</button>
                    <button class="btn_delete" onclick="deleteRecord('${record}')">Delete</button>
                </div>
            `;

            container.appendChild(div);
        });
    };

    // Filter records by date
    const normalize = (s) => String(s || '').toLowerCase().replace(/[\s_\-]+/g, '');

    const setActiveSegment = (target) => {
        document.querySelectorAll('.segment').forEach(b => b.classList.remove('active'));
        const btn = document.querySelector(`.segment[data-target="${target}"]`);
        if (btn) btn.classList.add('active');

        // show/hide inputs
        document.getElementById('search_date').style.display = (target === 'date') ? '' : 'none';
        document.getElementById('search_checklist').style.display = (target === 'checklist') ? '' : 'none';
        document.getElementById('search_employee').style.display = (target === 'employee') ? '' : 'none';
    };

    const filterRecords = () => {
        const active = document.querySelector('.segment.active')?.dataset.target || 'date';

        if (active === 'date') {
            const dateInput = document.getElementById('search_date').value;
            if (!dateInput) { renderRecords(allRecords); return; }
            const [year, month, day] = dateInput.split('-');
            const searchDate = `${day}-${month}-${year}`;
            const filtered = allRecords.filter(record => record.includes(searchDate));
            renderRecords(filtered);
            return;
        }

        if (active === 'checklist') {
            const checklist = document.getElementById('search_checklist').value;
            if (!checklist) { renderRecords(allRecords); return; }
            const filtered = allRecords.filter(record => record.toUpperCase().includes(checklist.toUpperCase()));
            renderRecords(filtered);
            return;
        }

        if (active === 'employee') {
            const name = normalize(document.getElementById('search_employee').value);
            if (!name) { renderRecords(allRecords); return; }
            const filtered = allRecords.filter(record => normalize(record).includes(name));
            renderRecords(filtered);
            return;
        }
    };

    // Clear search
    const clearSearch = () => {
        document.getElementById('search_date').value = '';
        document.getElementById('search_checklist').value = '';
        document.getElementById('search_employee').value = '';
        setActiveSegment('date');
        renderRecords(allRecords);
    };

    // Download/View record
    const downloadRecord = (fileName) => {
        window.open(`/records/${fileName}`, '_blank');
    };

    // Delete record
    const deleteRecord = async (fileName) => {
        if (!confirm(`Are you sure you want to delete ${fileName}?`)) {
            return;
        }

        try {
            const response = await fetch(`/api/records/${encodeURIComponent(fileName)}`, {
                method: 'DELETE'
            });

            const data = await response.json();

            if (data.success) {
                // Remove from list
                allRecords = allRecords.filter(r => r !== fileName);
                renderRecords(allRecords);
                alert('Record deleted successfully');
            } else {
                alert('Error deleting record: ' + data.message);
            }
        } catch (err) {
            console.error('Error deleting record:', err);
            alert('Error deleting record');
        }
    };

    // Event listeners
    document.getElementById('search_btn').addEventListener('click', filterRecords);
    document.getElementById('clear_btn').addEventListener('click', clearSearch);
    document.getElementById('search_date').addEventListener('keyup', (e) => { if (e.key === 'Enter') filterRecords(); });
    document.getElementById('search_employee').addEventListener('keyup', (e) => { if (e.key === 'Enter') filterRecords(); });
    document.getElementById('search_checklist').addEventListener('change', () => { filterRecords(); });

    document.querySelectorAll('.segment').forEach(s => s.addEventListener('click', (e) => setActiveSegment(e.currentTarget.dataset.target)));

    // Initialize
    initializeEmployee();
    fetchRecords();
</script>

</body>
</html>
