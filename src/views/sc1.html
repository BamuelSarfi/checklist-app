<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SC1 Checklist</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="help_overlay.css">
</head>

<body>

<div id="phone_body">

<div id="header">
    <button id="back_button" onclick="window.location.href='/'">
        <img src="/asset1.png" alt="Back">
    </button>

    <div id="title">
        <img src="/asset2.png" alt="Title">
        <h1>SC1 - Food Delivery Records</h1>
    </div>
</div>

    <div style="display: flex;">
    <div id="date">Date: <span id="current_date"></span></div>
    <button id="info" data-help="sc1_info" onclick="openHelp(this.dataset.help)">
        <img src="https://www.svgrepo.com/show/502710/info.svg" alt="Info">
    </button>
</div>

<!-- SC1 FORM CARDS -->
<div id="question_container">
    <form id="sc1_form">
        <!-- Records will be dynamically added here -->
    </form>

    <!-- Add Record Button -->
    <button id="add_record_button" type="button">
        <img src="https://www.svgrepo.com/show/510785/add-plus.svg" alt="Add Record" style="width: 20px; height: 20px; margin-right: 8px;">
        Add Record
    </button>
</div>

<!-- BOTTOM -->
<div id="bottom">
    <div id="employee_section">
        Employee: <span id="employee_name_display"></span>
    </div>
    <div id="library_section">
        <img src="https://www.svgrepo.com/show/435359/library.svg" alt="Library">
    </div>
    <!--Alert if sure-->
    <button id="save_button_sc1" class="save_button">
        <img src="https://www.svgrepo.com/show/502821/save.svg">
    </button>
</div>

</div>

<script>
document.getElementById('current_date').textContent = new Date().toLocaleDateString('en-GB');

let employee_id = null;
let employeeData = null;

const initializeEmployee = async () => {
    // Try to get from sessionStorage first
    const stored = sessionStorage.getItem('employeeData');
    if (stored) {
        employeeData = JSON.parse(stored);
    } else {
        // Fallback to API call
        try {
            const response = await fetch('/api/employee');
            const data = await response.json();
            if (data.success) {
                employeeData = data.employee;
                sessionStorage.setItem('employeeData', JSON.stringify(employeeData));
            }
        } catch (err) {
            console.error('Error fetching employee data:', err);
        }
    }

    // Display employee name
    if (employeeData) {
        employee_id = employeeData.id;
        document.getElementById('employee_name_display').textContent = employeeData.name || "Employee";
    } else {
        document.getElementById('employee_name_display').textContent = "Employee";
    }
};

initializeEmployee();

// SC1 FORM INITIALIZATION
let recordCount = 0;
const maxRecords = 16;

const initializeSC1Form = () => {
    const container = document.getElementById('question_container');
    const form = document.getElementById('sc1_form');

    // Clear existing content
    form.innerHTML = '';

    // Add initial record
    addRecord();

    // Set up add record button
    document.getElementById('add_record_button').addEventListener('click', addRecord);
};

const addRecord = () => {
    if (recordCount >= maxRecords) {
        alert('Maximum of 16 records allowed');
        return;
    }

    recordCount++;
    const currentDate = new Date().toLocaleDateString('en-GB');
    const employeeName = employeeData?.name || "Employee";

    const card = document.createElement('div');
    card.className = 'sc1_record_card';
    card.id = `record_${recordCount}`;

    card.innerHTML = `
        <div class="sc1_record_header">
            <div class="sc1_record_number">Record ${recordCount}/${maxRecords}</div>
            <div class="sc1_record_date">${currentDate}</div>
            <button type="button" class="sc1_remove_button" onclick="removeRecord(${recordCount})">
                <img src="https://www.svgrepo.com/show/491212/cross.svg" alt="Remove" style="width: 16px; height: 16px;">
            </button>
        </div>

        <div class="sc1_field_group">
            <label class="sc1_field_label" for="food_item${recordCount}">Food Item (high risk ready-to-eat foods only)</label>
            <input type="text" class="sc1_text_input" id="food_item${recordCount}" name="food_item${recordCount}" placeholder="Enter food item">
        </div>

        <div class="sc1_field_group">
            <label class="sc1_field_label" for="supplied_by${recordCount}">Supplied By (name of supplier)</label>
            <input type="text" class="sc1_text_input" id="supplied_by${recordCount}" name="supplied_by${recordCount}" placeholder="Enter supplier name">
        </div>

        <div class="sc1_field_group">
            <div class="sc1_checkbox_container">
                <input type="checkbox" class="sc1_checkbox_input" id="checked_use_by${recordCount}" name="checked_use_by${recordCount}">
                <label class="sc1_checkbox_label" for="checked_use_by${recordCount}">Checked use by date and condition</label>
            </div>
        </div>

        <div class="sc1_field_group">
            <label class="sc1_field_label" for="temp${recordCount}">Temperature (°C)</label>
            <input type="number" class="sc1_temp_input" id="temp${recordCount}" name="temp${recordCount}" placeholder="Enter temperature">
        </div>

        <div class="sc1_sign_field">
            <label class="sc1_field_label" for="sign${recordCount}">Signature</label>
            <input type="text" class="sc1_text_input sc1_readonly_field" id="sign${recordCount}" name="sign${recordCount}" value="${employeeName}" readonly>
            <input type="hidden" id="date${recordCount}" name="date${recordCount}" value="${currentDate}">
        </div>
    `;

    document.getElementById('sc1_form').appendChild(card);

    // Update button state
    updateAddButtonState();
};

const removeRecord = (recordId) => {
    const card = document.getElementById(`record_${recordId}`);
    if (card) {
        card.remove();
        recordCount--;

        // Renumber remaining records
        const cards = document.querySelectorAll('.sc1_record_card');
        cards.forEach((card, index) => {
            const newNumber = index + 1;
            card.id = `record_${newNumber}`;
            card.querySelector('.sc1_record_number').textContent = `Record ${newNumber}`;

            // Update button onclick
            const removeBtn = card.querySelector('.sc1_remove_button');
            if (removeBtn) {
                removeBtn.onclick = () => removeRecord(newNumber);
            }
        });

        updateAddButtonState();
    }
};

const updateAddButtonState = () => {
    const addButton = document.getElementById('add_record_button');
    if (recordCount >= maxRecords) {
        addButton.disabled = true;
        addButton.textContent = 'Maximum Records Reached';
    } else {
        addButton.disabled = false;
        addButton.innerHTML = '<img src="https://www.svgrepo.com/show/510785/add-plus.svg" alt="Add Record" style="width: 20px; height: 20px; margin-right: 8px;">Add Record';
    }
};

// Load existing SC1 records for today
const loadExistingRecords = async () => {
    try {
        const today = new Date().toLocaleDateString('en-GB').replace(/\//g, '-');
        const sanitizedName = (employeeData?.name || 'Employee').replace(/[^a-zA-Z0-9]/g, '_');
        const filename = `SC1-${today}-${sanitizedName}.json`;

        const response = await fetch(`/records/${filename}`);
        if (response.ok) {
            const existingData = await response.json();
            if (existingData.records && existingData.records.length > 0) {
                // Load existing records into the form
                for (const record of existingData.records) {
                    if (recordCount < 16) {
                        addRecord();
                        const index = recordCount;

                        // Fill in the data
                        document.getElementById(`food_item${index}`).value = record.food_item || '';
                        document.getElementById(`supplied_by${index}`).value = record.supplied_by || '';
                        document.getElementById(`checked_use_by${index}`).checked = record.checked_use_by || false;
                        document.getElementById(`temp${index}`).value = record.temp || '';
                    }
                }
                updateAddButtonState();
            }
        }
    } catch (err) {
        // Silently fail if no existing records - this is expected for new days
        console.log('No existing records found for today');
    }
};

// Handle save button for SC1 form
document.getElementById('save_button_sc1')?.addEventListener('click', async (e) => {
    e.preventDefault();

    // Collect form data
    const formData = {
        employee_id: employee_id,
        employee_name: employeeData?.name || "Employee",
        records: []
    };

    // Collect data from all existing records
    for (let i = 1; i <= recordCount; i++) {
        const date = document.getElementById(`date${i}`)?.value;
        const foodItem = document.getElementById(`food_item${i}`)?.value;
        const suppliedBy = document.getElementById(`supplied_by${i}`)?.value;
        const checkedUseBy = document.getElementById(`checked_use_by${i}`)?.checked;
        const temp = document.getElementById(`temp${i}`)?.value;
        const sign = document.getElementById(`sign${i}`)?.value;

        // Only include rows with at least some data
        if (foodItem || suppliedBy || temp) {
            formData.records.push({
                row: i,
                date: date,
                food_item: foodItem,
                supplied_by: suppliedBy,
                checked_use_by: checkedUseBy,
                temp: temp,
                sign: sign
            });
        }
    }

    // Send to backend
    try {
        const response = await fetch('/sc1', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(formData)
        });

        const result = await response.json();
        if (result.success) {
            alert(result.message + (result.totalRecords ? ` (${result.totalRecords} total records)` : ''));
            
            // // Download the PDF
            // if (result.filename) {
            //     const downloadLink = document.createElement('a');
            //     downloadLink.href = `/records/${result.filename}`;
            //     downloadLink.download = result.filename;
            //     document.body.appendChild(downloadLink);
            //     downloadLink.click();
            //     document.body.removeChild(downloadLink);
                
            // }
            
            // Reset form to initial state after successful save
            recordCount = 0;
            initializeSC1Form();
            window.location.href = '/';
        } else {
            // alert('Error saving form: ' + (result.message || 'Unknown error'));
            window.location.href = '/';
        }
    } catch (err) {
        console.error('Error submitting form:', err);
        // alert('Error saving form: ' + err.message);
        window.location.href = '/';
    }
});

// Toggle checklist for SC5 page
document.querySelectorAll('.button_checklist_container').forEach(container => {
    container.addEventListener('click', () => {
        const img = container.querySelector('.check_img');
        const input = container.parentElement.querySelector('input');

        if (img.style.display === 'none') {
            img.style.display = 'block';
            input.value = 'yes';
        } else {
            img.style.display = 'none';
            input.value = 'no';
        }
    });
});

// Initialize SC1 form when DOM is loaded
if (document.getElementById('question_container')) {
    initializeSC1Form();
    // Load existing records after employee data is available
    const initializeWhenReady = () => {
        if (employeeData) {
            loadExistingRecords();
        } else {
            // Wait for employee data to load
            setTimeout(initializeWhenReady, 100);
        }
    };
    initializeWhenReady();
}

</script>

<script src="help_overlay.js"></script>

<!-- Help overlay -->
<div id="help_overlay" aria-hidden="true">
    <div id="help_inner">
        <div id="help_header">
            <div id="help_title">Help</div>
            <button id="help_close" aria-label="Close">Close</button>
        </div>

        <!-- Footer-->
            <footer class="site_footer">
                <a href="/privacy-policy">Privacy Policy</a>
                <span>© 2026 Checklist App</span>
            </footer>
        <div id="help_body">
            <img id="help_image" src="" alt="Help image">
            <div id="help_caption">Tap the image to view details. Tap outside to close.</div>
        </div>
    </div>
</div>
</script>

<script src="script.js"></script>

</body>
</html>
