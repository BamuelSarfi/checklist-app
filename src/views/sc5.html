<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SC5 Checklist</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="help_overlay.css">
    <link rel="stylesheet" href="/design-system/index.global.css">
</head>

<style>
    body {
        margin: 0 auto;
    }
</style>

<body class="kiosk-body">
    <div class="kiosk-frame">

        <div class="kiosk-header">
            <div style="display: flex; align-items: center; gap: 12px">
                <a href="/" title="Back to dashboard" aria-label="Back to dashboard" class="kiosk-icon-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M19 12H5"></path>
                        <path d="M12 19l-7-7 7-7"></path>
                    </svg>
                </a>
                <div class="kiosk-logo-slot" id="brand-logo-slot">SC</div>
                <div style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0">
                    <span id="brand-site-name"
                        style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-muted)">Safe
                        Catering</span>
                    <span
                        style="font-size: 15px; font-weight: 700; line-height: 1.2; color: var(--color-text-heading)">SC5
                        - Hygiene Checklist</span>
                </div>
                <span id="header" style="display: contents"></span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px">
                <span style="flex: 1; font-size: 14px; color: var(--color-text-secondary)">Date: <span
                        id="current_date"></span></span>
                <label class="kiosk-lang-select" title="Change language">
                    <span aria-hidden="true" style="font-size: 15px">&#127760;</span>
                    <select id="language-select" aria-label="Change language"></select>
                </label>
                <button type="button" id="info" class="kiosk-icon-btn" data-help="sc5_form_info"
                    onclick="openHelp(this.dataset.help)" title="How this form works" aria-label="How this form works">
                    <span class="kiosk-info-glyph">i</span>
                </button>
            </div>
            <div style="display: flex; align-items: center; gap: 10px">
                <div
                    style="flex: 1; height: 6px; border-radius: 999px; background: var(--color-bg-active); overflow: hidden">
                    <div id="progress-bar-fill" style="width: 0%; height: 100%; background: var(--color-success)"></div>
                </div>
                <span id="progress-label"
                    style="font-size: 13px; font-weight: 600; color: var(--color-text-muted); white-space: nowrap">0
                    checked</span>
            </div>
        </div>

        <div style="flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 16px">
            <div id="sc5_completed_banner"
                style="display: none; background: var(--color-success-cell-bg); border: 1px solid var(--color-border-soft); border-radius: var(--radius-sm); padding: 12px 14px; font-weight: 700; text-align: center;">
                &check; SC5 has already been completed today.
            </div>

            <div id="question_container" style="display: flex; flex-direction: column; gap: 8px;"></div>

            <div class="kiosk-card" style="margin-top: 2px;">
                <label style="display: flex; flex-direction: column; gap: 6px">
                    <span class="kiosk-field-label">Comments/corrective action</span>
                    <textarea id="sc5_comments" rows="4" class="kiosk-textarea"
                        placeholder="Record any issues found and the action taken..."></textarea>
                </label>
                <div class="kiosk-summary-box">
                    <div class="kiosk-summary-row"><span class="kiosk-summary-row-label">Employee name</span><span
                            class="kiosk-summary-row-value" id="summary-name">-</span></div>
                    <div class="kiosk-summary-row"><span class="kiosk-summary-row-label">Date</span><span
                            class="kiosk-summary-row-value" id="summary-date">-</span></div>
                    <div class="kiosk-summary-row"><span class="kiosk-summary-row-label">Signature/initial</span><span
                            class="kiosk-summary-row-value" id="summary-sign">-</span></div>
                </div>
            </div>
        </div>

        <div class="kiosk-bottom-bar">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0">
                <span
                    style="font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-muted)">Signed
                    in</span>
                <span id="employee_name_display"
                    style="font-size: 14px; font-weight: 600; color: var(--color-text-heading); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">-</span>
            </div>
            <a href="/library" class="kiosk-bottom-nav-btn" title="Library" aria-label="Library">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 4v16"></path>
                    <path d="M9.5 4v16"></path>
                    <path d="M15 4.5l4 15.5"></path>
                </svg>
            </a>
            <div id="save-button-mount"></div>
        </div>
    </div>

    <script src="translations.js"></script>
    <script src="/design-system/index.global.js"></script>
    <script>
        const questions = [
            { id: 'q1', text: 'Are food rooms and equipment in good condition and well maintained?' },
            { id: 'q2', text: 'Are food rooms clean and tidy and do staff clean as they go including difficult areas?' },
            { id: 'q3', text: 'Is equipment easy to clean and kept in a clean condition?' },
            { id: 'q4', text: 'Are all food and hand contact surfaces e.g. work surfaces, slicers, fridge handles, probe thermometers, in good condition and cleaned/ disinfected regularly?' },
            { id: 'q5', text: 'Are suitable BS EN approved cleaning chemicals available and stored correctly and are proper cleaning methods used?' },
            { id: 'q6', text: 'Are separate cleaning cloths used in clean areas? If they are re-used are they laundered in a boil wash?' },
            { id: 'q7', text: 'Are deliveries appropriately stored immediately?' },
            { id: 'q8', text: 'Is ready-to-eat food stored above/separate from raw food in the fridges and freezers?' },
            { id: 'q9', text: 'Is food in fridges/freezers covered?' },
            { id: 'q10', text: 'Are high risk foods date coded, codes checked daily and stock rotated?' },
            { id: 'q11', text: 'Are dried goods stored correctly e.g. in a suitable room, off the floor, in covered containers?' },
            { id: 'q12', text: 'Is outer packaging removed from ready-to-eat food before being placed into a clean area?' },
            { id: 'q13', text: 'Are freezers working properly?' },
            { id: 'q14', text: 'Are fridges and freezers defrosted regularly?' },
            { id: 'q15', text: 'Are ready-to-eat foods prepared in separate clean areas?' },
            { id: 'q16', text: 'Are separate utensils and equipment used for ready-to-eat foods unless disinfected in a dishwasher? Is the dishwasher in good working order and regularly serviced?' },
            { id: 'q17', text: 'Is wrapping and packaging used for ready-to-eat food kept in the clean area?' },
            { id: 'q18', text: 'Do separate staff handle ready-to-eat food or are controls being followed to ensure staff change clothing and wash hands before handling ready-to-eat food?' },
            { id: 'q19', text: 'Is separate complex equipment provided for ready-to-eat food and is it located in the clean area?' },
            { id: 'q20', text: 'Are staff handling food as little as possible? eg Using tongs' },
            { id: 'q21', text: 'If colour coded equipment is provided (e.g. utensils, chopping boards), is it correctly used?' },
            { id: 'q22', text: 'Are high risk foods prepared in small batches and placed in the fridge immediately after handling/preparation?' },
            { id: 'q23', text: 'Is food cooled as quickly as possible away from raw food and other sources of contamination?' },
            { id: 'q24', text: "Are vegetables/fruit/salads trimmed and washed thoroughly before use unless labelled as 'ready-to-eat'?" },
            { id: 'q25', text: 'Are ready-to-eat foods kept separate on display and screened from customers?' },
            { id: 'q26', text: 'Are adequate clean utensils available for self service?' },
            { id: 'q27', text: 'Are frozen foods defrosted safely?' },
            { id: 'q28', text: 'Are controls in place to prevent contamination by chemicals/foreign bodies e.g. glass, packaging materials, bolts, rust, cleaning chemicals?' },
            { id: 'q29', text: 'Are staff aware of food allergy hazards?' },
            { id: 'q30', text: 'Are controls being followed to ensure staff wash hands after handing raw food and before touching surfaces, such as the cash register?' },
            { id: 'q31', text: 'Is a separate probe thermometer used for ready-to-eat foods and properly cleaned/disinfected before use?' },
            { id: 'q32', text: 'Are staff fit to work, wearing clean, suitable protective clothing and following personal hygiene rules particularly hand washing?' },
            { id: 'q33', text: 'Are wash hand basins clean with hot water, soap and hygienic hand drying facilities?' },
            { id: 'q34', text: 'Are wash hand basins used for hand washing only and is effective handwashing by staff regularly observed?' },
            { id: 'q35', text: 'Are staff toilets and changing facilities clean and tidy?' },
            { id: 'q36', text: 'Are premises pest proofed and free from any signs of pests?' },
            { id: 'q37', text: 'Where necessary are external doors/ windows fitted with suitable flyscreens?' },
            { id: 'q38', text: 'Are insectocutors (if provided) properly maintained?' },
            { id: 'q39', text: 'Is food properly protected from risk of contamination by pests?' },
            { id: 'q40', text: 'Is waste in food rooms stored correctly?' },
            { id: 'q41', text: 'Is food waste stored correctly outside and is the refuse area kept clean?' },
            { id: 'q42', text: 'Is unfit food clearly labelled and stored separately from other foods?' },
            { id: 'q43', text: 'Are all checks properly taken and recorded?' },
            { id: 'q44', text: 'Has appropriate corrective action been taken where necessary?' },
            { id: 'q45', text: 'Are record sheets up-to-date, checked and verified?' },
            { id: 'q46', text: 'Are equipment time/temperature combinations regularly cross-checked?' },
            { id: 'q47', text: 'Any new suppliers and approved list updated?' },
            { id: 'q48', text: 'Any new menu items and steps in Safe Catering updated?' },
            { id: 'q49', text: 'Any new food handling methods or equipment and steps in Safe Catering updated?' },
        ];

        const t = window.appI18n ? window.appI18n.t : (key) => key;
        const answers = {};
        const container = document.getElementById('question_container');

        function renderQuestions() {
            container.innerHTML = '';
            questions.forEach((q) => {
                const checked = answers[q.id] === 'yes';
                const row = document.createElement('button');
                row.type = 'button';
                row.className = 'kiosk-toggle-row';
                row.setAttribute('aria-pressed', String(checked));
                row.innerHTML = `
                <span class="kiosk-toggle-box${checked ? ' is-checked' : ''}">${checked ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>' : ''}</span>
                <span style="flex: 1; font-size: 14px; line-height: 1.4; color: var(--color-text-heading)">${q.text}</span>
                <input type="hidden" name="${q.id}" value="${checked ? 'yes' : 'no'}">
            `;
                row.addEventListener('click', () => {
                    answers[q.id] = answers[q.id] === 'yes' ? 'no' : 'yes';
                    renderQuestions();
                });
                container.appendChild(row);
            });

            const done = questions.filter((q) => answers[q.id] === 'yes').length;
            document.getElementById('progress-label').textContent = t('{count} of {total} checked', { count: done, total: questions.length });
            document.getElementById('progress-bar-fill').style.width = `${(done / questions.length) * 100}%`;

            if (window.applyTranslations) {
                window.applyTranslations(container);
            }
        }

        renderQuestions();

        const date_input = new Date().toLocaleDateString('en-GB');
        document.getElementById('current_date').textContent = date_input;
        document.getElementById('summary-date').textContent = date_input;

        let employee_id = null;
        let employeeData = null;

        const initializeEmployee = async () => {
            const stored = sessionStorage.getItem('employeeData');
            if (stored) {
                try {
                    employeeData = JSON.parse(stored);
                } catch (_error) {
                    employeeData = null;
                }
            }

            if (!employeeData) {
                try {
                    const response = await fetch('/api/employee');
                    const data = await response.json();
                    if (data.success) {
                        employeeData = data.employee;
                        sessionStorage.setItem('employeeData', JSON.stringify(employeeData));
                    }
                } catch (error) {
                    console.error('Error fetching employee data for SC5:', error);
                }
            }

            if (employeeData) {
                employee_id = employeeData.id;
                const name = employeeData.name || 'Employee';
                document.getElementById('employee_name_display').textContent = name;
                document.getElementById('summary-name').textContent = name;
                document.getElementById('summary-sign').textContent = name;
            }
        };

        const { React, ReactDOM, Button } = window.KitchenDS;
        const saveButtonRoot = ReactDOM.createRoot(document.getElementById('save-button-mount'));

        function renderSaveButton(isLoading) {
            saveButtonRoot.render(React.createElement(Button, {
                variant: 'primary',
                loading: !!isLoading,
                onClick: () => saveForm(),
                style: { minHeight: 48, padding: '0 18px', fontSize: 14, fontWeight: 600, borderRadius: 'var(--radius-sm)', border: '1px solid var(--color-success)', boxShadow: 'none' },
            }, t('Save')));
        }
        renderSaveButton(false);

        const checkAlreadyCompleted = async () => {
            try {
                const response = await fetch('/sc5/status');
                const data = await response.json();
                if (data.success && data.completed) {
                    document.getElementById('sc5_completed_banner').style.display = '';
                    document.getElementById('question_container').style.display = 'none';
                    document.getElementById('save-button-mount').style.display = 'none';
                }
            } catch (error) {
                console.error('Error checking SC5 completion status:', error);
            }
        };

        initializeEmployee();
        checkAlreadyCompleted();

        // ---- Brand lookup ----
        (async () => {
            try {
                const response = await fetch('/api/brand');
                if (!response.ok) return;
                const data = await response.json();
                const kitchenName = data?.kitchen?.name || data?.brand_name || data?.business?.display_name || 'Safe Catering';
                const logoSrc = data?.kitchen?.logo_src || data?.logo_src || data?.business?.logo_src || '';
                document.getElementById('brand-site-name').textContent = kitchenName;
                if (logoSrc) {
                    const slot = document.getElementById('brand-logo-slot');
                    slot.textContent = '';
                    const img = document.createElement('img');
                    img.src = logoSrc;
                    img.alt = kitchenName;
                    slot.appendChild(img);
                }
            } catch (_error) { /* optional */ }
        })();

        // ---- Language switcher ----
        const langSelect = document.getElementById('language-select');
        if (window.appI18n) {
            window.appI18n.getLanguageOptions().forEach(({ value, label }) => {
                const opt = document.createElement('option');
                opt.value = value;
                opt.textContent = label;
                langSelect.appendChild(opt);
            });
            langSelect.value = window.appI18n.getAppLanguage();
            langSelect.addEventListener('change', () => {
                window.appI18n.setAppLanguage(langSelect.value);
                window.location.reload();
            });
        }

        const saveForm = async () => {
            if (!employee_id) {
                await initializeEmployee();
            }

            if (!employee_id) {
                await window.showAppModal(t('Employee not identified. Please log in again.'), { type: 'error' });
                return;
            }

            const data = { date: date_input, employee_id, comments: document.getElementById('sc5_comments').value || '' };
            questions.forEach((q) => { data[q.id] = answers[q.id] === 'yes' ? 'yes' : 'no'; });

            const requestOptions = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data),
            };

            renderSaveButton(true);

            try {
                const outcome = window.syncEngine
                    ? await window.syncEngine.submitOrQueue('/sc5', requestOptions, { formType: 'SC5', employeeId: employee_id })
                    : { ok: true, response: await fetch('/sc5', requestOptions) };

                if (outcome.queued) {
                    if (employeeData) sessionStorage.setItem('employeeData', JSON.stringify(employeeData));
                    await window.showAppModal(window.appI18n ? window.appI18n.t('Saved locally. Will sync automatically when online.') : 'Saved locally. Will sync automatically when online.', { type: 'success' });
                    window.location.href = '/';
                    return;
                }

                const response = outcome.response;
                const text = await response.text();
                let result = {};
                if (text) {
                    try { result = JSON.parse(text); } catch (_err) { result = { error: text }; }
                }

                if (result.already_completed) {
                    await window.showAppModal(t('SC5 has already been completed today.'), { type: 'info' });
                    checkAlreadyCompleted();
                    return;
                }

                if (!response.ok || !result.success) {
                    throw new Error(result.error || result.message || `Unable to submit SC5 form (${response.status})`);
                }

                if (employeeData) sessionStorage.setItem('employeeData', JSON.stringify(employeeData));

                await window.showAppModal(t('SC5 form submitted successfully'), { type: 'success' });
                window.notifySyncWarning?.(result.sync_warning);
                window.location.href = '/';
            } catch (err) {
                console.error('Error submitting form:', err);
                await window.showAppModal(t('Error submitting SC5 form: {message}', { message: err.message }), { type: 'error' });
            } finally {
                renderSaveButton(false);
            }
        };
    </script>

    <script src="help_overlay.js"></script>

    <div id="help_overlay" aria-hidden="true">
        <div id="help_inner">
            <div id="help_header">
                <div id="help_title">Help</div>
                <button id="help_close" aria-label="Close">Close</button>
            </div>
            <footer class="site_footer">
                <a href="/privacy-policy">Privacy Policy</a>
                <span>&copy; 2026 Safecateruk</span>
            </footer>
            <div id="help_body">
                <img id="help_image" src="" alt="Help image">
                <div id="help_caption">Tap the image to view details. Tap outside to close.</div>
            </div>
        </div>
    </div>

    <script src="js/offline-store.js"></script>
    <script src="js/sync-engine.js"></script>
    <script src="js/status-badge.js"></script>
    <script src="script.js"></script>

</body>

</html>
